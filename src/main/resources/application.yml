spring:
  application:
    name: onboarding_requirement
  datasource:
    url: jdbc:postgresql://user-data-db:5432/user_data
    username: user_data_db
    password: user_data_db
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
        highlight_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect